[tools]
"aqua:zizmorcore/zizmor" = "1.31.1"
actionlint = "1.7.12"
node = "24.22.1"
pnpm = "10.34.5"

[tasks."lint:workflows"]
description = "GitHub Actions lint (actionlint + zizmor)"
# Run sequentially: depends runs tasks in parallel, and one failing aborts the other
run = [{ task = "lint:actionlint" }, { task = "lint:zizmor" }]

[tasks."lint:actionlint"]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint -color"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions security with zizmor"
run = "zizmor .github/"
