name: Actions Lint

on:
  push:
    paths:
      - ".github/**"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ActionsLint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: actionlint aqua:zizmorcore/zizmor

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor .github/
        env:
          # Used for online audits (impostor-commit, etc.)
          GH_TOKEN: ${{ github.token }}
