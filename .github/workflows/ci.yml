name: CI

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job IDs double as required status check names, so do not change them.
#
# zizmor recommends the `$/` syntax for same-repo references, but actionlint 1.7.12
# (the latest at the time of writing) rejects it as an unknown format, so keep `./`.
# Once actionlint supports it, drop the ignore and migrate to `$/.github/actions/setup`.
jobs:
  Build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The top page prerenders the stores data, so the build needs a database.
    # An empty, migrated Postgres is enough to check that it builds.
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_POOLED: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Migrate database
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

  Lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Check
        run: pnpm check

  Test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Test (unit)
        run: pnpm test:unit

      - name: Test (oxlint rules)
        run: pnpm test:oxlint-rules
